                return parts.join("\n\n");

                    const updateSection = (text, heading, previousAuto, newAuto) => {
                        if (!newAuto) return text;

                        const newSection = `${heading}\n${newAuto}`;
                        const previousSection = previousAuto ? `${heading}\n${previousAuto}` : '';

                        // If the previous AI text is still untouched, it is safe to refresh it.
                        if (previousSection && text.includes(previousSection)) {
                            return text.replace(previousSection, newSection);
                        }

                        // If this section already exists but no longer matches the previous
                        // AI text, the examiner has edited it. Preserve the examiner's wording.
                        if (text.includes(heading)) {
                            return text;
                        }

                        // This is a new section (e.g. Conversation after Reading). Append it
                        // without changing any feedback the examiner has already edited.
                        return text.trim() ? `${text.trim()}\n\n${newSection}` : newSection;

                className: student.class,
                indexNo: '',
                studentName: student.name,
                examiner: currentExaminer,
                mtl: student.mtl,
                syllabus: syllabus === 'standard' ? '华文' : '基础华文',

                readingPronScore: scores.readingPron,
                readingFluencyScore: scores.readingFluency,
                readingCombinedScore: readingCombined,

                convResponseScore: scores.convResponse,
                convLanguageScore: scores.convLanguage,
                convCombinedScore: convTotal,

                totalScore: grandTotal,
                maxTotal: maxTotal,
                feedback: feedbackText,
                timestamp: new Date().toLocaleString('zh-CN', { hour12: false })
            });

            const submitAssessment = async (forceDuplicate = false) => {
                setSubmitStatus('loading');

                try {
                    const payload = {
                        ...buildPayload(),
                        forceDuplicate
                    };

                    const response = await fetch(gasUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();
                    setSubmitStatus('idle');

                    // Code.gs is the final authority. If another examiner/device
                    // submitted first, do not save another row unless the examiner
                    // explicitly chooses to continue.
                    if (result && result.duplicate && result.saved === false) {
                        showDuplicateWarning(result.previous || null);
                        return;
                    }

                    if (!result || result.ok !== true || result.saved !== true) {
                        throw new Error((result && result.error) || 'Submission was not confirmed.');
                    }

                    const key = `P5|${student.mtl}|${student.name}`.toUpperCase();
                    localStorage.setItem(`oralSubmitted:${key}`, JSON.stringify({
                        examiner: currentExaminer,
                        timestamp: new Date().toLocaleString('zh-CN', { hour12: false })
                    }));

                    setDialog({
                        isOpen: true,
                        title: '✅ 提交成功！',
                        message: `学生 ${student.name} 的成绩已保存到云端。`,
                        type: 'alert',
                        isSuccess: true
                    });
                } catch (error) {
                    setSubmitStatus('idle');
                    setDialog({
                        isOpen: true,
                        title: '提交失败',
                        message: '系统未能确认成绩已经保存。请检查网络后再试。',
                        type: 'alert'
                    });
                }
            };

            const showDuplicateWarning = (previous) => {
                const details = previous
                    ? `\n上一次主考老师：${previous.examiner || '未记录'}\n上一次提交时间：${previous.timestamp || '未记录'}`
                    : '';

                setDialog({
                    isOpen: true,
                    title: '⚠️ 成绩已提交',
                    message: `学生 ${student.name} 的成绩已经提交过。${details}\n\n请选择“取消”返回检查，或“继续”再次提交。`,
                    type: 'confirm',
                    onConfirm: () => {
                        setDialog(d => ({ ...d, isOpen: false }));
                        submitAssessment(true);
                    }
                });
            };

            const handleSubmitGAS = async () => {
                if (!student.name || !student.mtl || !currentExaminer) {
                    setDialog({ isOpen: true, title: '提示', message: '请确保填入学生姓名、MT班级并选择主考老师。', type: 'alert' });
                    return;
                }

                if (submitStatus === 'loading') return;

                const key = `P5|${student.mtl}|${student.name}`.toUpperCase();
                const localPrevious = localStorage.getItem(`oralSubmitted:${key}`);

                // Safeguard 1: catches accidental second submission immediately
                // on the same browser/device, even without resetting the form.
                if (localPrevious) {
                    let previous = null;
                    try { previous = JSON.parse(localPrevious); } catch (e) {}
                    showDuplicateWarning(previous);
                    return;
                }

                setSubmitStatus('loading');

                // Safeguard 2: checks the Google Sheet, so a submission by
                // another examiner/device is also detected.
                try {
                    const checkUrl =
                        `${gasUrl}?action=check&level=P5&mtClass=${encodeURIComponent(student.mtl)}` +
                        `&studentName=${encodeURIComponent(student.name)}&_=${Date.now()}`;

                    const response = await fetch(checkUrl, {
                        method: 'GET',
                        cache: 'no-store',
                        redirect: 'follow'
                    });
                    const result = await response.json();

                    setSubmitStatus('idle');

                    if (result && result.exists) {
                        showDuplicateWarning(result.previous || null);
                        return;
                    }

                    await submitAssessment();
                } catch (error) {
                    // If the preliminary GET check fails, continue to POST.
                    // Code.gs performs the authoritative duplicate check while
                    // holding the script lock, so this does not create an
                    // accidental duplicate.
                    setSubmitStatus('idle');
                    await submitAssessment(false);
                }
            };

            const resetForm = () => {
                setDialog({
                    isOpen: true,
                    title: '确认清空',
                    message: '确定要清空当前分数，准备给下一位学生打分吗？',
                    type: 'confirm',
                    onConfirm: () => {
                        clearScores();
                    }
                });
            }

            const renderRubricRow = (categoryKey, rubricObj) => (
                <div className="mb-10 bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200 no-print">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <h3 className="font-bold text-xl md:text-2xl text-slate-800">
                            {rubricObj.title} <span className="text-slate-400 text-lg font-medium">({rubricObj.max}分)</span>
                        </h3>
                        <div className="flex items-center space-x-3 bg-blue-50 px-4 py-2 rounded-xl border border-blue-200 w-full md:w-auto justify-between md:justify-start">
                            <span className="text-base md:text-lg text-blue-900 font-bold">得分:</span>
                            <div className="flex items-baseline">
                                <input 
                                    type="number" 
                                    min="0" max={rubricObj.max}
                                    value={scores[categoryKey]} 
                                    onChange={(e) => handleScoreChange(categoryKey, e.target.value)}
                                    className="w-16 text-center font-black text-2xl text-blue-700 bg-transparent border-b-2 border-blue-300 focus:outline-none focus:border-blue-700 transition-colors"
                                />
                                <span className="text-slate-500 font-medium ml-1">/{rubricObj.max}</span>
                            </div>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                        {rubricObj.items.map((item, index) => {
                            const isSelected = selections[categoryKey] === index;
                            return (
                                <div 
                                    key={index}
                                    onClick={() => handleSelect(categoryKey, index, item.scores[item.scores.length - 1])}
                                    className={`cursor-pointer rounded-xl p-4 transition-all duration-200 border-2 flex flex-col ${
                                        isSelected 
                                        ? 'border-blue-600 bg-blue-50 shadow-md ring-4 ring-blue-100 scale-[1.02]' 
                                        : 'border-slate-200 hover:border-blue-400 hover:bg-slate-50'
                                    }`}
                                >
                                    <div className="flex flex-wrap gap-2 mb-3">
                                        {item.scores.map(s => (
                                            <button
                                                key={s}
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    handleSelect(categoryKey, index, s);
                                                }}
                                                className={`w-9 h-9 md:w-10 md:h-10 rounded-lg flex items-center justify-center text-sm md:text-base font-black transition-all ${
                                                    isSelected && scores[categoryKey] === s 
                                                    ? 'bg-blue-600 text-white shadow-lg scale-110' 
                                                    : 'bg-white border-2 border-slate-300 text-slate-600 hover:bg-blue-100 hover:text-blue-800 hover:border-blue-400'
                                                }`}
                                            >
                                                {s}
                                            </button>
                                        ))}
                                    </div>
                                    <div className={`font-bold text-lg mb-2 ${isSelected ? 'text-blue-800' : 'text-slate-700'}`}>
                                        {item.label}
                                    </div>
                                    <div className={`text-sm leading-relaxed flex-grow ${isSelected ? 'text-blue-900/80 font-medium' : 'text-slate-500'}`}>
                                        {item.desc}
                                    </div>
                                </div>
                            )
                        })}
                    </div>
                </div>
            );

            return (
                <div className="max-w-7xl mx-auto p-4 md:p-6 lg:p-8">
                    
                    {/* Modal Dialogs */}
                    {dialog.isOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm px-4 no-print">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all border border-slate-200">
                                <div className={`p-10 ${dialog.isSuccess ? 'bg-green-50 text-center' : ''}`}>
                                    {dialog.isSuccess && <div className="text-7xl mb-6">🎉</div>}
                                    <h3 className={`font-black text-3xl mb-4 ${dialog.isSuccess ? 'text-green-800' : 'text-slate-900'}`}>
                                        {dialog.title || '提示'}
                                    </h3>
                                    <p className={`leading-relaxed text-xl ${dialog.isSuccess ? 'text-green-900 font-medium' : 'text-slate-600'}`}>
                                        {dialog.message}
                                    </p>
                                </div>
                                <div className="p-6 bg-slate-50 border-t border-slate-100 flex justify-center space-x-4">
                                    {dialog.type === 'confirm' && (
                                        <button 
                                            onClick={() => setDialog({ ...dialog, isOpen: false })} 
                                            className="px-8 py-4 text-slate-600 font-bold text-lg hover:bg-slate-200 rounded-xl transition-colors w-full"
                                        >
                                            取消
                                        </button>
                                    )}
                                    <button 
                                        onClick={() => { 
                                            if(dialog.onConfirm) dialog.onConfirm(); 
                                            setDialog({ ...dialog, isOpen: false, isSuccess: false }); 
                                        }} 
                                        className={`px-8 py-4 text-white font-black text-lg rounded-xl shadow-lg transition-colors w-full ${dialog.isSuccess ? 'bg-green-600 hover:bg-green-700' : 'bg-blue-600 hover:bg-blue-700'}`}
                                    >
                                        我知道了
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Top Navigation & Info Bar */}
                    <div className="sticky top-0 z-10 bg-white/95 backdrop-blur-xl shadow-md border-b border-slate-200 rounded-b-3xl p-4 lg:p-5 mb-8 flex flex-col xl:flex-row justify-between items-start xl:items-center no-print gap-4 transition-all">
                        
                        <div className="flex flex-col space-y-4 w-full xl:w-auto">
                            {/* App Title and Actions */}
                            <div className="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                                <span className="text-2xl font-black bg-gradient-to-r from-blue-700 to-indigo-700 bg-clip-text text-transparent drop-shadow-sm whitespace-nowrap">雅德小学五年级华文/基础华文口试</span>
                                
                                {/* Syllabus Toggle Button */}
                                <div className="flex bg-white p-1 rounded-xl border border-slate-200 shadow-sm">
                                    <button
                                        onClick={() => handleSyllabusChange('standard')}
                                        className={`px-4 py-1.5 rounded-lg font-bold text-sm transition-all ${syllabus === 'standard' ? 'bg-slate-100 text-blue-700 shadow-inner' : 'text-slate-500 hover:text-slate-700'}`}
                                    >
                                        华文
                                    </button>
                                    <button
                                        onClick={() => handleSyllabusChange('foundation')}
                                        className={`px-4 py-1.5 rounded-lg font-bold text-sm transition-all ${syllabus === 'foundation' ? 'bg-slate-100 text-emerald-700 shadow-inner' : 'text-slate-500 hover:text-slate-700'}`}
                                    >
                                        基础华文
                                    </button>
                                </div>
                            </div>

                            {/* Dropdowns: Team Number -> 级任班 -> 母语班 -> 考生 -> 主考老师 */}
                            <div className="flex flex-wrap items-center gap-3">
                                <div className="flex items-center space-x-1">
                                    <span className="text-xs font-bold text-slate-500 uppercase">Team Number:</span>
                                    <select value={student.team} onChange={handleTeamChange} className="border-2 border-slate-200 rounded-xl px-3 py-2 bg-white focus:ring-4 focus:ring-blue-500/20 outline-none font-bold text-blue-700 cursor-pointer shadow-sm">
                                        <option value="">- 选择 -</option>
                                        {availableTeams.map(t => <option key={t} value={t}>Team {t}</option>)}
                                    </select>
                                </div>

                                <div className="flex items-center space-x-1">
                                    <span className="text-xs font-bold text-slate-500 uppercase">级任班:</span>
                                    <select value={student.class} onChange={handleFormClassChange} disabled={!student.team} className="border-2 border-slate-200 rounded-xl px-3 py-2 bg-white focus:ring-4 focus:ring-blue-500/20 outline-none font-bold text-slate-800 cursor-pointer shadow-sm disabled:bg-slate-100 disabled:cursor-not-allowed">
                                        <option value="">- 选择 -</option>
                                        {availableFormClasses.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>

                                <div className="flex items-center space-x-1">
                                    <span className="text-xs font-bold text-slate-500 uppercase">母语班:</span>
                                    <select value={student.mtl} onChange={handleMTClassChange} disabled={!student.class} className="border-2 border-slate-200 rounded-xl px-3 py-2 bg-white focus:ring-4 focus:ring-blue-500/20 outline-none font-bold text-slate-800 cursor-pointer shadow-sm disabled:bg-slate-100 disabled:cursor-not-allowed">
                                        <option value="">- 选择 -</option>
                                        {availableMTClasses.map(m => <option key={m} value={m}>{m}</option>)}
                                    </select>
                                </div>

                                <div className="flex items-center space-x-1">
                                    <span className="text-xs font-bold text-slate-500 uppercase">考生:</span>
                                    <select value={student.name} onChange={handleStudentSelect} disabled={!student.mtl} className="w-40 md:w-56 border-2 border-slate-200 rounded-xl px-3 py-2 bg-white focus:ring-4 focus:ring-blue-500/20 outline-none font-bold text-blue-700 shadow-sm cursor-pointer disabled:bg-slate-100 disabled:cursor-not-allowed">
                                        <option value="">- 选择 -</option>
                                        {filteredStudents.map((s, i) => <option key={i} value={s.name}>{s.name}</option>)}
                                    </select>
                                </div>

                                <div className="flex items-center space-x-1 md:border-l-2 md:border-slate-200 md:pl-3">
                                    <span className="text-xs font-bold text-purple-600 uppercase">主考老师:</span>
                                    <select value={currentExaminer} onChange={handleExaminerChange} disabled={!student.team} className="border-2 border-purple-200 rounded-xl px-3 py-2 bg-purple-50 focus:ring-4 focus:ring-purple-500/20 outline-none font-bold text-purple-800 shadow-sm cursor-pointer disabled:bg-slate-100 disabled:cursor-not-allowed">
                                        <option value="">- 选择 -</option>
                                        {availableExaminers.map(t => <option key={t} value={t}>{t}</option>)}
                                    </select>
                                </div>
                            </div>
                        </div>

                        {/* Live Score Summary */}
                        <div className="flex items-center justify-end space-x-4 md:space-x-6 w-full xl:w-auto bg-white/50 xl:bg-transparent p-3 xl:p-0 rounded-2xl xl:rounded-none">
                            <div className="text-center">
                                <div className="text-xs text-slate-500 font-bold mb-1">朗读小计</div>
                                <div className="font-black text-xl text-indigo-600">{readingCombined}<span className="text-sm text-slate-400 font-medium">/{maxReading}</span></div>
                            </div>
                            <div className="text-center">
                                <div className="text-xs text-slate-500 font-bold mb-1">会话小计</div>
                                <div className="font-black text-xl text-indigo-600">{convTotal}<span className="text-sm text-slate-400 font-medium">/{maxConv}</span></div>
                            </div>
                            <div className={`text-center px-6 py-2 rounded-2xl shadow-md transition-colors ${syllabus === 'foundation' ? 'bg-emerald-600' : 'bg-blue-600'} text-white`}>
                                <div className="text-xs font-bold opacity-90 mb-1">总分</div>
                                <div className="font-black text-3xl leading-none">{grandTotal}<span className="text-sm font-medium opacity-80 ml-1">/{maxTotal}</span></div>
                            </div>
                        </div>
                    </div>

                    {/* Print Only View */}
                    <div className="print-only print-container">
                        <div className="text-center mb-6 border-b-2 border-slate-200 pb-6">
                            <h1 className="text-3xl font-black text-slate-900 mb-2 tracking-wide">🌟 雅德小学五年级华文/基础华文口试反馈单 🌟</h1>
                            <p className="text-slate-500 mb-4 text-lg">({syllabus === 'standard' ? '华文' : '基础华文'})</p>
                            <div className="flex justify-center flex-wrap gap-6 text-lg text-slate-700 font-medium">
                                <span>Team Number：<strong className="text-slate-900 font-black">{student.team ? `Team ${student.team}` : "未选择"}</strong></span>
                                <span>级任班：<strong className="text-slate-900 font-black">{student.class || "未选择"}</strong></span>
                                <span>母语班：<strong className="text-slate-900 font-black">{student.mtl || "未选择"}</strong></span>
                                <span>考生：<strong className="text-slate-900 font-black">{student.name || "未选择"}</strong></span>
                                <span>主考老师：<strong className="text-slate-900 font-black">{currentExaminer || "未选择"}</strong></span>
                            </div>
                        </div>
                        
                        <div className="flex justify-center items-center gap-4 mb-8">
                            <div className="bg-slate-50 border-2 border-slate-200 rounded-2xl p-4 w-32 text-center">
                                <div className="text-slate-600 font-bold text-sm mb-1">朗读</div>
                                <div className="text-2xl font-black text-slate-800">{readingCombined} <span className="text-base font-normal text-slate-400">/ {maxReading}</span></div>
                            </div>
                            <div className="text-2xl text-slate-300 font-light">+</div>
                            <div className="bg-slate-50 border-2 border-slate-200 rounded-2xl p-4 w-32 text-center">
                                <div className="text-slate-600 font-bold text-sm mb-1">会话</div>
                                <div className="text-2xl font-black text-slate-800">{convTotal} <span className="text-base font-normal text-slate-400">/ {maxConv}</span></div>
                            </div>
                            <div className="text-2xl text-slate-300 font-light">=</div>
                            <div className={`border-4 rounded-2xl p-5 w-40 text-center shadow-sm ${syllabus === 'foundation' ? 'bg-emerald-50 border-emerald-200' : 'bg-blue-50 border-blue-200'}`}>
                                <div className={`font-bold text-sm mb-1 ${syllabus === 'foundation' ? 'text-emerald-700' : 'text-blue-700'}`}>本次总分</div>
                                <div className={`text-4xl font-black ${syllabus === 'foundation' ? 'text-emerald-800' : 'text-blue-800'}`}>{grandTotal} <span className={`text-lg ${syllabus === 'foundation' ? 'text-emerald-400' : 'text-blue-400'}`}>/ {maxTotal}</span></div>
                            </div>
                        </div>

                        <div className="mb-6">
                            <h2 className="text-xl font-black text-slate-900 mb-4 flex items-center">
                                <span className={`w-8 h-8 rounded-full flex items-center justify-center mr-3 text-lg ${syllabus === 'foundation' ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700'}`}>💡</span> 
                                老师对你说：
                            </h2>
                            <div className="bg-slate-50 border-2 border-slate-100 rounded-2xl p-6 text-lg text-slate-800 leading-loose font-medium text-justify whitespace-pre-wrap min-h-[150px]">
                                {feedbackText || "老师还没有完成评分哦。"}
                            </div>
                        </div>
                        
                        <div className="text-center mt-10 text-slate-500 font-black text-lg tracking-widest">
                            继续加油！期待你下一次的精彩表现！🚀
                        </div>
                    </div>

                    {/* Interactive Rubrics Area */}
                    <div className="no-print">
                        <div className="mb-12">
                            <h2 className={`text-2xl font-black text-slate-800 mb-6 px-4 border-l-8 rounded-sm ${syllabus === 'foundation' ? 'border-emerald-500' : 'border-blue-600'}`}>
                                第一部分：朗读短文 ({isFoundation ? '15分 [（语音+语调）÷ 2]' : '20分'})
                            </h2>
                            {renderRubricRow('readingPron', currentRubrics.readingPron)}
                            {renderRubricRow('readingFluency', currentRubrics.readingFluency)}
                        </div>

                        <div className="mb-12">
                            <h2 className={`text-2xl font-black text-slate-800 mb-6 px-4 border-l-8 rounded-sm ${syllabus === 'foundation' ? 'border-emerald-500' : 'border-green-500'}`}>
                                第二部分：看录像会话 ({maxConv}分)
                            </h2>
                            {renderRubricRow('convResponse', currentRubrics.convResponse)}
                            {renderRubricRow('convLanguage', currentRubrics.convLanguage)}
                        </div>

                        {/* Feedback Editor Area */}
                        <div className={`mt-12 p-6 md:p-8 rounded-3xl border-2 shadow-sm ${syllabus === 'foundation' ? 'bg-emerald-50/50 border-emerald-100' : 'bg-blue-50/50 border-blue-100'}`}>
                            <h3 className={`font-black text-xl md:text-2xl mb-4 flex items-center ${syllabus === 'foundation' ? 'text-emerald-900' : 'text-blue-900'}`}>
                                📝 自动生成评语预览 
                                <span className={`text-sm font-normal ml-3 px-3 py-1 rounded-full ${syllabus === 'foundation' ? 'text-emerald-600 bg-emerald-100' : 'text-blue-600 bg-blue-100'}`}>
                                    (可直接点击框内随意修改、添加或删除内容)
                                </span>
                            </h3>
                            <textarea 
                                className={`w-full h-48 md:h-64 p-6 rounded-2xl border-2 focus:ring-4 outline-none resize-none text-slate-800 text-lg leading-relaxed text-justify shadow-inner bg-white ${syllabus === 'foundation' ? 'border-emerald-200 focus:ring-emerald-500/20 focus:border-emerald-500' : 'border-blue-200 focus:ring-blue-500/20 focus:border-blue-500'}`}
                                value={feedbackText}
                                onChange={(e) => setFeedbackText(e.target.value)}
                                placeholder="点击上方表格，这里会自动生成针对性的评语。你也可以直接在这里输入特别寄语..."

                            <div className="flex flex-col md:flex-row justify-between items-center mt-8 gap-4 pt-6 border-t border-slate-200/60">
                                <button 
                                    onClick={resetForm} 
                                    className="flex items-center text-slate-600 bg-white hover:bg-slate-100 border-2 border-slate-200 font-bold text-base px-6 py-3 rounded-xl transition-all order-2 md:order-1 shadow-sm"
                                >
                                    🔄 清空重置 
                                </button>
                                
                                <div className="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-3 w-full md:w-auto order-1 md:order-2">
                                    <button 
                                        onClick={handleSavePDF}
                                        className="justify-center bg-white border-2 border-slate-300 hover:border-slate-400 text-slate-800 px-6 py-3 rounded-xl font-bold text-base shadow-sm flex items-center transition-all"
                                    >
                                        💾 保存 PDF
                                    </button>
                                    {pdfStatus && (
                                        <span className="self-center text-sm font-bold text-green-700 whitespace-nowrap">{pdfStatus}</span>
                                    )}
                                    <button 
                                        onClick={handleSubmitGAS}
                                        disabled={submitStatus === 'loading'}
                                        className={`justify-center text-white px-8 py-3 rounded-xl font-bold text-base shadow-md flex items-center transition-all transform hover:-translate-y-0.5 ${
                                            submitStatus === 'loading' 
                                            ? 'bg-indigo-400' 
                                            : (syllabus === 'foundation' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-indigo-600 hover:bg-indigo-700')
                                        }`}
                                    >
                                        {submitStatus === 'loading' ? '☁️ 提交中...' : '☁️ 提交云端表格'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
